<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRT Translator</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-language"></i> SRT Subtitle Translator</h1>
        </header>
        
        <main>
            <div class="upload-section">
                <div class="upload-container" id="upload-container">
                    <i class="fas fa-file-upload upload-icon"></i>
                    <h2>Drag & Drop your SRT file here</h2>
                    <p>or</p>
                    <label for="file-input" class="upload-button">Choose File</label>
                    <input type="file" id="file-input" accept=".srt" hidden>
                </div>
            </div>
            
            <div class="options-section hidden" id="options-section">
                <h2>Translation Options</h2>
                <div class="file-info" id="file-info">
                    <p><strong>File:</strong> <span id="file-name"></span></p>
                </div>
                <div class="language-selector">
                    <label for="target-language">Target Language:</label>
                    <select id="target-language">
                        <option value="ar">Arabic</option>
                        <option value="zh">Chinese</option>
                        <option value="en">English</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="hi">Hindi</option>
                        <option value="it">Italian</option>
                        <option value="ja">Japanese</option>
                        <option value="ko">Korean</option>
                        <option value="pt">Portuguese</option>
                        <option value="ru">Russian</option>
                        <option value="es">Spanish</option>
                    </select>
                </div>
                <button id="translate-button" class="action-button"><i class="fas fa-globe"></i> Translate</button>
            </div>
            
            <div class="progress-section hidden" id="progress-section">
                <h2>Translation in Progress</h2>
                <div class="progress-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <p id="progress-text">Translating subtitles: 0%</p>
            </div>
            
            <div class="preview-section hidden" id="preview-section">
                <h2>Preview</h2>
                <div class="preview-container" id="preview-container">
                    <!-- Preview content will be loaded here -->
                </div>
                <div class="preview-actions">
                    <button id="download-button" class="action-button"><i class="fas fa-download"></i> Download Translated SRT</button>
                    <button id="new-translation-button" class="action-button secondary"><i class="fas fa-redo"></i> New Translation</button>
                </div>
            </div>
        </main>
        
        <footer>
            <p>SRT Translator | Powered by AI</p>
        </footer>
    </div>

    <script type="importmap">
    {
        "imports": {
            "config": "./config.js"
        }
    }
    </script>
    <script src="script.js" type="module"></script>
</body>
</html>
